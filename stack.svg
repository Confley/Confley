      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="card">
      <rect x="1" y="1" width="418" height="274" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="420" height="276" rx="14" fill="#000000"/>
    <ellipse cx="352" cy="26" rx="120" ry="72" fill="#0066ff" opacity="0.34" filter="url(#soft)"/>
    <ellipse cx="30" cy="278" rx="88" ry="48" fill="#6600cc" opacity="0.09" filter="url(#soft)"/>
    <!-- tercer pez -->
    <text x="322" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0066ff" opacity="0.13">&gt;&lt;(((º&gt;</text>
  </g>
  <rect x="0.5" y="0.5" width="419" height="275" rx="14" fill="none" stroke="#0066ff" stroke-opacity="0.22"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="24" y="34" font-size="11" fill="#555570" letter-spacing="1.6">STACK</text>
  </g>
  <line x1="24" y1="46" x2="396" y2="46" stroke="#0066ff" stroke-opacity="0.16"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8888a0">
